# ==========================================================
# APPLICATION
# ==========================================================
spring.application.name=grabpic-backend
app.display.name=GrabPic Backend

# ==========================================================
# JAVA / APPLICATION STORAGE PROVIDER
# ==========================================================
# Supported values: gcs, local
app.storage.provider=${STORAGE_PROVIDER:gcs}
app.storage.local.base-dir=${APP_UPLOAD_DIR:/storage}
app.storage.delete-on-upload-failure=${STORAGE_DELETE_ON_UPLOAD_FAILURE:true}
app.storage.generate-signed-urls-for-thumbnails=${STORAGE_SIGN_THUMBNAILS:true}
app.storage.generate-original-signed-url-on-demand=${STORAGE_SIGN_ORIGINAL_ON_DEMAND:true}
app.storage.use-signed-urls-for-upload-responses=${STORAGE_SIGN_UPLOAD_RESPONSES:true}

# ==========================================================
# GOOGLE CLOUD CONFIGURATION
# ==========================================================
gcp.project-id=${GCP_PROJECT_ID:}
gcp.storage.bucket=${GCS_BUCKET_NAME:grabpic-media}
gcp.storage.location=${GCS_BUCKET_LOCATION:asia-south1}

# Authentication: adc = Application Default Credentials (VM-attached Service Account)
# Never configure service account JSON keys.
gcp.storage.authentication-mode=${GCS_AUTH_MODE:adc}

# ==========================================================
# GCS OBJECT NAMING
# ==========================================================
gcp.storage.object-prefix=${GCS_OBJECT_PREFIX:events}
gcp.storage.original-directory=${GCS_ORIGINAL_DIRECTORY:original}
gcp.storage.thumbnail-directory=${GCS_THUMBNAIL_DIRECTORY:thumbnail}
gcp.storage.signed-url-version=${GCS_SIGNED_URL_VERSION:V4}

# ==========================================================
# SIGNED URL CONFIGURATION
# ==========================================================
gcp.storage.signed-url.enabled=${GCS_SIGNED_URL_ENABLED:true}
gcp.storage.signed-url.duration-minutes=${GCS_SIGNED_URL_DURATION_MINUTES:15}
gcp.storage.signed-url.max-duration-minutes=${GCS_SIGNED_URL_MAX_DURATION_MINUTES:60}
gcp.storage.signed-url.signing-service-account=${GCS_SIGNING_SERVICE_ACCOUNT:529807292953-compute@developer.gserviceaccount.com}

# ==========================================================
# IMAGE PROCESSING & THUMBNAILS
# ==========================================================
app.image.thumbnail.enabled=${IMAGE_THUMBNAIL_ENABLED:true}
app.image.thumbnail.width=${IMAGE_THUMBNAIL_WIDTH:400}
app.image.thumbnail.height=${IMAGE_THUMBNAIL_HEIGHT:400}
app.image.thumbnail.quality=${IMAGE_THUMBNAIL_QUALITY:0.80}
app.image.thumbnail.format=${IMAGE_THUMBNAIL_FORMAT:jpeg}
app.image.thumbnail.preserve-aspect-ratio=${IMAGE_THUMBNAIL_PRESERVE_ASPECT_RATIO:true}

# ==========================================================
# UPLOAD CONFIGURATION & LIMITS
# ==========================================================
app.upload.max-files=${APP_UPLOAD_MAX_FILES:50}
app.upload.max-zip-size-mb=${APP_UPLOAD_MAX_ZIP_SIZE_MB:500}
app.upload.max-image-size-mb=${APP_UPLOAD_MAX_IMAGE_SIZE_MB:25}
app.upload.allowed-content-types=${APP_UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/jpg,image/png,image/webp}
app.upload.zip-temp-dir=${APP_UPLOAD_ZIP_TEMP_DIR:${java.io.tmpdir}}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:500MB}
server.tomcat.max-swallow-size=${SERVER_TOMCAT_MAX_SWALLOW_SIZE:-1}

# ==========================================================
# PYTHON FACE SERVICE (FASTAPI + INSIGHTFACE)
# ==========================================================
python.face.service.base-url=${PYTHON_FACE_SERVICE_BASE_URL:http://face-service:8001}
python.face.service.embed-path=${PYTHON_FACE_SERVICE_EMBED_PATH:/embed}
python.face.service.connect-timeout-ms=${PYTHON_FACE_SERVICE_CONNECT_TIMEOUT_MS:5000}
python.face.service.read-timeout-ms=${PYTHON_FACE_SERVICE_READ_TIMEOUT_MS:120000}

# ==========================================================
# DATABASE (POSTGRESQL + PGVECTOR)
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grabpic_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:grabpic_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:grabpic_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================================
# JWT AUTHENTICATION
# ==========================================================
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ==========================================================
# EMAIL / SMTP (GMAIL)
# ==========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:sohamdharap9@gmail.com}
spring.mail.password=${MAIL_PASSWORD:txhcxhunfukqdduz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from-name=${MAIL_FROM_NAME:GrabPic Admin}

# ==========================================================
# OTP CONFIGURATION
# ==========================================================
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
app.otp.hardcoded-enabled=${OTP_HARDCODED_ENABLED:false}
app.otp.hardcoded-value=${OTP_HARDCODED_VALUE:123456}

# ==========================================================
# ACTUATOR & MONITORING
# ==========================================================
management.endpoints.web.exposure.include=health,info,metrics,env,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.diskspace.enabled=true
management.health.mail.enabled=true
management.info.build.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.prometheus.metrics.export.enabled=true

# ==========================================================
# LOGGING
# ==========================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework=INFO
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.com.grabpic=${LOGGING_LEVEL_APP:INFO}
