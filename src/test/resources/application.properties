spring.application.name=backend-test
app.display.name=GrabPic Backend
app.jwt.secret=test-secret-key-for-unit-tests-minimum-32-chars
app.jwt.expiration-ms=86400000

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=test

app.otp.expiry-minutes=10
app.otp.max-attempts=3

# Storage: use local provider for unit/integration tests
app.storage.provider=local
app.storage.local.base-dir=target/test-storage
gcp.storage.bucket=test-grabpic-media
gcp.storage.signed-url.signing-service-account=529807292953-compute@developer.gserviceaccount.com

python.face.service.base-url=http://localhost:8001
python.face.service.embed-path=/embed
python.face.service.connect-timeout-ms=5000
python.face.service.read-timeout-ms=120000

management.endpoints.web.exposure.include=health,info,metrics,env,prometheus
management.endpoint.health.show-details=always
