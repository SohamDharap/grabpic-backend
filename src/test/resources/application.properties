spring.application.name=backend-test
app.display.name=GrabPic Backend
app.jwt.secret=test-secret-key-for-unit-tests-minimum-32-chars
app.jwt.expiration-ms=86400000

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=test

app.otp.expiry-minutes=10
app.otp.max-attempts=3

python.face.service.url=http://localhost:8001/embed
face.service.url=http://localhost:8001/embed
app.upload.dir=./uploads-test

management.endpoints.web.exposure.include=health,info,metrics,env,prometheus
management.endpoint.health.show-details=always
