version: "3.8"

services:
  # ==========================================
  # PostgreSQL + pgvector
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grabpic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grabpic_db
      POSTGRES_USER: grabpic_user
      POSTGRES_PASSWORD: grabpic_pass
    ports:
      - "5432:5432"
    volumes:
      - grabpic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grabpic_user -d grabpic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grabpic-network

  # ==========================================
  # Python Face Embedding Service (InsightFace + FastAPI)
  # ==========================================
  face-service:
    image: ${DOCKER_USERNAME:-sohamdharap}/grabpic-face-service:${FACE_SERVICE_TAG:-latest}
    container_name: grabpic-face-service
    restart: unless-stopped
    expose:
      - "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - grabpic-network

  # ==========================================
  # Spring Boot Backend (GCS Cloud Storage)
  # ==========================================
  backend:
    image: ${DOCKER_USERNAME:-sohamdharap}/grabpic-backend:${IMAGE_TAG:-latest}
    container_name: grabpic-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grabpic_db
      SPRING_DATASOURCE_USERNAME: grabpic_user
      SPRING_DATASOURCE_PASSWORD: grabpic_pass
      PYTHON_FACE_SERVICE_BASE_URL: http://face-service:8001
      STORAGE_PROVIDER: gcs
      GCS_BUCKET_NAME: grabpic-media
      GCS_AUTH_MODE: adc
    depends_on:
      postgres:
        condition: service_healthy
      face-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - grabpic-network

volumes:
  grabpic-pgdata:

networks:
  grabpic-network:
    driver: bridge
